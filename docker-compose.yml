services:
  app:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-true}
    image: contact-scraper:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-3003}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
