[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contact-scraper"
version = "0.1.0"
description = "Find phone numbers and emails on business websites listed in an Excel file."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
contact-scraper = "contact_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contact_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
